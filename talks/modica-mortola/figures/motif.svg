<?xml version="1.0" encoding="UTF-8"?>
<!-- Faint phase-field motif for title & closing backgrounds: a diffuse interface
     (tanh profile) sweeping across, a double-well silhouette, and a light lattice. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="iface" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#2563eb" stop-opacity="0.05"/>
      <stop offset="48%" stop-color="#2563eb" stop-opacity="0.05"/>
      <stop offset="52%" stop-color="#ea7317" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ea7317" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- two faint phase regions split by a soft diffuse interface -->
  <rect x="0" y="0" width="1280" height="720" fill="url(#iface)"/>
  <!-- diffuse interface line (tanh), teal, very faint -->
  <path d="M 640,0
           C 700,180 580,300 640,360
           C 700,420 580,540 640,720"
        fill="none" stroke="#0f766e" stroke-opacity="0.10" stroke-width="3"/>
  <!-- double-well silhouette along the bottom -->
  <path d="M 120,640 C 240,640 300,560 400,560 C 470,560 500,610 560,610
           C 640,610 660,560 760,560 C 860,560 900,640 1020,640"
        fill="none" stroke="#0f766e" stroke-opacity="0.08" stroke-width="3"/>
  <!-- faint lattice dots, lower-left -->
  <g fill="#0f766e" fill-opacity="0.05">
    <!-- generated rows -->
    <g>
      <circle cx="90"  cy="120" r="4"/><circle cx="140" cy="120" r="4"/><circle cx="190" cy="120" r="4"/>
      <circle cx="90"  cy="170" r="4"/><circle cx="140" cy="170" r="4"/><circle cx="190" cy="170" r="4"/>
      <circle cx="90"  cy="220" r="4"/><circle cx="140" cy="220" r="4"/><circle cx="190" cy="220" r="4"/>
    </g>
  </g>
</svg>
